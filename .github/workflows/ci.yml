name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: executor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Parse PowerShell operator scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath .\scripts -Filter '*.ps1' | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("PowerShell parse errors in " + $_.Name + ": " + ($errors | Out-String))
            }
          }
          if ($failed) { exit 1 }
      - name: Qualify real full Desktop Commander payload at 8/64
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\qualify-real-payload.ps1
      - run: npm run audit


  synology-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: nodes/synology/go.sum
      - name: Test Synology node
        working-directory: nodes/synology
        run: go test ./...
      - name: Cross-compile DS216 ARMv7 node
        working-directory: nodes/synology
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: go build -o build/executor-node ./cmd/executor-node
