name: ci

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: executor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Parse PowerShell operator scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath .\scripts -Filter '*.ps1' | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("PowerShell parse errors in " + $_.Name + ": " + ($errors | Out-String))
            }
          }
          if ($failed) { exit 1 }
      - name: Qualify real full Desktop Commander payload at 8/64
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\qualify-real-payload.ps1
      - run: npm run audit


  synology-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache-dependency-path: nodes/synology/go.sum
      - name: Test Synology node
        working-directory: nodes/synology
        run: go test ./...
      - name: Repeat real restart handoff qualification
        working-directory: nodes/synology
        run: go test ./internal/admin -run TestOSReplacementCoordinatorTwentyRealProcessCycles -count=1 -v
      - name: Test DSM package lifecycle
        run: bash nodes/synology/tests/spk_test.sh
      - name: Build DS216 armada38x SPK
        run: bash nodes/synology/build-spk.sh
      - name: Validate DS216 SPK
        run: bash nodes/synology/validate-spk.sh
      - name: Inspect ARMv7 payload
        run: |
          file nodes/synology/build/spk/payload/bin/executor-node | tee /tmp/executor-node-file.txt
          grep -E 'ELF 32-bit.*ARM' /tmp/executor-node-file.txt
          ! grep -q 'dynamically linked' /tmp/executor-node-file.txt
      - name: Upload ExecutorNode SPK
        uses: actions/upload-artifact@v4
        with:
          name: ExecutorNode-armada38x-0.1.0-0004.spk
          path: nodes/synology/build/spk/ExecutorNode-armada38x-0.1.0-0004.spk
          if-no-files-found: error
