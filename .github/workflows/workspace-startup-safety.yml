name: Workspace Startup Safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject concealed editor-startup execution
        run: python3 -m unittest discover -s tests -p test_workspace_startup_safety.py -v
